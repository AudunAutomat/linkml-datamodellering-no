  seksjon.artefakter.kolonne_artefakt:
    nn: Artefakt
    en: Artifact
  seksjon.artefakter.kolonne_fil:
    nn: Fil
    en: File
  seksjon.artefakter.byggekonfigurasjon:
    nn: "Full byggekonfigurasjon: {lenkje}"
