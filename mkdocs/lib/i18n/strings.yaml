    en: This page is not yet available in English. The Norwegian (nynorsk) version is shown.
  i18n.modellinnhald_norsk:
    nn: Modellinnhaldet (navn og skildringar av klasser, eigenskapar og kodelister) er på norsk.
    en: Model content (names and descriptions of classes, properties and code lists) is in Norwegian.

