    en: "This model imports and reuses components from other schemas. "
  seksjon.avhengigheiter.forklaring_2:
    nn: Importerte klasser og eigenskapar kan vere synlege i diagram, valideringsrapportar og andre analysar sjølv om dei ikkje blir lista som lokale element i denne modellen.
    en: Imported classes and properties may appear in diagrams, validation reports and other analyses even though they are not listed as local elements of this model.
  seksjon.avhengigheiter.innleiing:
    nn: "Dette skjemaet importerer følgjande skjema (direkte og transitivt):"
    en: "This schema imports the following schemas (directly and transitively):"
  seksjon.avhengigheiter.sjaa_importhierarki:
    nn: Sjå [Importhierarki](../../arkitektur/importhierarki.md) for oversikt over heile repoet sitt importhierarki.
    en: See [Import hierarchy](../../arkitektur/importhierarki.md) for an overview of the import hierarchy of the whole repository.
  seksjon.avhengigheiter.importerte_modeller:
    nn: Importerte modeller
    en: Imported models

