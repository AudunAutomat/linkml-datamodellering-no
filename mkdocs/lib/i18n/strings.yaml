  seksjon.om_modellen.forklaring:
    nn: Denne sida dokumenterer LinkML-modellen {skjema}, inkludert klasser, eigenskapar, datatypar, valideringsresultat og genererte artefakter. Informasjonen er generert automatisk frå skjemaet og tilhøyrande byggeproses.
    en: This page documents the LinkML model {skjema}, including classes, properties, data types, validation results and generated artifacts. The information is generated automatically from the schema and its build process.
  seksjon.om_modellen.offisiell_referanse:
    nn: Offisiell referanse
    en: Official reference

  seksjon.delmodell.tittel:
    nn: Delmodell
    en: Submodel
  seksjon.delmodell.tekst:
    nn: Denne modellen er ein delmodell av {forelder}.
    en: This model is a submodel of {forelder}.
  seksjon.delmodellar.tittel:
    nn: Delmodellar
    en: Submodels
  seksjon.delmodellar.innleiing:
    nn: "Denne modellen er delt i fleire delmodellar:"
    en: "This model is divided into several submodels:"

  seksjon.datamodell.tittel:
    nn: Datamodell
    en: Data model
  seksjon.datamodell.forklaring:
    nn: Dette er den autoritative kjelda for modellen. Alle tabellar, diagram og artefakt på denne sida er genererte frå dette skjemaet.
    en: This is the authoritative source of the model. All tables, diagrams and artifacts on this page are generated from this schema.
  seksjon.datamodell.kjelde:
    nn: "Kjelde-datamodell i LinkML-format: {lenkje}"
    en: "Source data model in LinkML format: {lenkje}"

  seksjon.er_diagram.tittel:
    nn: ER-diagram
    en: ER diagram
  seksjon.er_diagram.forklaring:
    nn: ER-diagrammet viser struktur og relasjonar mellom dei lokale klassane i modellen. Importerte klasser er som standard filtrerte bort for å gjere diagrammet enklare å lese.
    en: The ER diagram shows the structure and relationships between the local classes of the model. Imported classes are filtered out by default to make the diagram easier to read.
  seksjon.er_diagram.alt:
    nn: ER-diagram
    en: ER diagram
  seksjon.er_diagram.ingen_lokale:
    nn: Modellen har ingen lokale klasser og ingen diagram med kun lokale klasser. [Vis fullstendig diagram med importerte klasser]({full}).
    en: The model has no local classes and no diagram with local classes only. [Show the full diagram with imported classes]({full}).
  seksjon.er_diagram.kun_lokale:
    nn: Diagrammet viser kun lokale klasser. Klikk for å zoome. [Vis fullstendig diagram med importerte klasser]({full}).
    en: The diagram shows local classes only. Click to zoom. [Show the full diagram with imported classes]({full}).
  seksjon.er_diagram.klikk_zoom:
    nn: Klikk for å zoome.
    en: Click to zoom.

  seksjon.avhengigheiter.tittel:
