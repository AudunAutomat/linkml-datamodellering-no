    en: Validate the schema against the {policy} policy
  seksjon.kom_i_gang.valider_data:
    nn: Valider datafil mot LinkML-skjemaet
    en: Validate a data file against the LinkML schema
  seksjon.kom_i_gang.java:
    nn: Java-bruk
    en: Using Java
  seksjon.kom_i_gang.python:
    nn: Python-bruk
    en: Using Python

  seksjon.validering.tittel:
