  seksjon.om_modellen.forklaring:
    nn: Denne sida dokumenterer LinkML-modellen {skjema}, inkludert klasser, eigenskapar, datatypar, valideringsresultat og genererte artefakter. Informasjonen er generert automatisk frå skjemaet og tilhøyrande byggeproses.
    en: This page documents the LinkML model {skjema}, including classes, properties, data types, validation results and generated artifacts. The information is generated automatically from the schema and its build process.
  seksjon.om_modellen.offisiell_referanse:
    nn: Offisiell referanse
    en: Official reference

  seksjon.delmodell.tittel:
    nn: Delmodell
    en: Submodel
  seksjon.delmodell.tekst:
    nn: Denne modellen er ein delmodell av {forelder}.
    en: This model is a submodel of {forelder}.
  seksjon.delmodellar.tittel:
    nn: Delmodellar
    en: Submodels
  seksjon.delmodellar.innleiing:
    nn: "Denne modellen er delt i fleire delmodellar:"
    en: "This model is divided into several submodels:"

  seksjon.datamodell.tittel:
    nn: Datamodell
    en: Data model
  seksjon.datamodell.forklaring:
    nn: Dette er den autoritative kjelda for modellen. Alle tabellar, diagram og artefakt på denne sida er genererte frå dette skjemaet.
