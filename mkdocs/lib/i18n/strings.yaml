    en: Validation results
  seksjon.validering.forklaring:
    nn: Valideringsrapporten viser i kva grad modellen etterlever definerte modelleringsreglar og kvalitetskrav. Resultata kan omfatte både lokale og importerte element avhengig av kva reglar som er evaluerte.
    en: The validation report shows to what extent the model complies with defined modelling rules and quality requirements. The results may cover both local and imported elements, depending on which rules were evaluated.
  seksjon.validering.ikkje_tilgjengeleg:
    nn: Valideringsresultat ikkje tilgjengeleg — ingen validering enno.
    en: Validation results not available — no validation yet.
  seksjon.validering.ugyldig_fil:
