    en: "The validation file is invalid or lacks required fields: {sti}"
  seksjon.validering.feilmelding:
    nn: "Feil: {feil}"
    en: "Error: {feil}"
  seksjon.validering.siste:
    nn: "Siste validering: {tid} — v{versjon} — {policy}"
    en: "Last validation: {tid} — v{versjon} — {policy}"
  seksjon.validering.status:
    nn: Status
    en: Status
  seksjon.validering.feil:
    nn: Feil
    en: Errors
  seksjon.validering.aatvaringar:
    nn: Åtvaringar
    en: Warnings
  seksjon.validering.godkjent:
    nn: Godkjent
    en: Passed
  seksjon.validering.ikkje_godkjent:
    nn: Ikkje godkjent
    en: Not passed

  seksjon.modellanalyse.tittel:
    nn: Modellanalyse
    en: Model analysis
  seksjon.modellanalyse.forklaring_kort:
    nn: Modellanalysen gjer analyser som kan påpeike moglege avvik for oppfølging. Dette er meir informativ innsikt til hjelp med modelleringa.
    en: The model analysis performs analyses that can point out possible deviations for follow-up. This is informative insight to help with the modelling.
  seksjon.modellanalyse.ikkje_tilgjengeleg:
    nn: Modellanalyse ikkje tilgjengeleg — krev at generate-workflowen har køyrt.
    en: Model analysis not available — requires the generate workflow to have run.
  seksjon.modellanalyse.forklaring:
    nn: Modellanalysen samanliknar dette skjemaet sine lokalt definerte klasse-, slot- og typenavn mot andre skjema i same domene, flaggar par med høg navnelikskap som eit mogleg duplikat- eller konsolideringssignal, og fangar lokalt definerte slots, enumerations, types, subsets og klasser som ikkje er i bruk lokalt i modellen. Analysen er informativ, ikkje ein valideringspolicy.
    en: The model analysis compares the locally defined class, slot and type names of this schema with other schemas in the same domain, flags pairs with high name similarity as a possible duplication or consolidation signal, and catches locally defined slots, enumerations, types, subsets and classes that are not used locally in the model. The analysis is informative, not a validation policy.
  seksjon.modellanalyse.workflow:
    nn: For IRI-dereferering og innhaldsforhandling sjå [Modell-analyse]({lenkje})-workflowen.
    en: For IRI dereferencing and content negotiation, see the [Modell-analyse]({lenkje}) workflow.
  seksjon.modellanalyse.rapport_manglar:
    nn: Rapport ikkje tilgjengeleg for denne bygginga.
    en: Report not available for this build.
  seksjon.modellanalyse.kryssdomene:
    nn: For fullstendig analyse av {objekttype} på tvers av domene sjå [{etikett}]({lenkje}).
    en: For a complete analysis of {objekttype} across domains, see [{etikett}]({lenkje}).

  # --- Modellanalyse-rapportar (generate-modellanalyse-md.py) ---
  modellanalyse.isolerte_klasser.tittel:
    nn: Isolerte klasser
    en: Isolated classes
  modellanalyse.isolerte_klasser.forklaring:
    nn: Analysen identifiserer klassar som ikkje har nokon strukturell kopling til andre klassar i skjemaet — verken via arv eller ved å bli refererte av ein slot. Eit funn kan tyde på ei gløymd eller ubrukt klasse, eller ei klasse som manglar ein slot som skal kople han til resten av modellen.
    en: The analysis identifies classes that have no structural connection to other classes in the schema — neither through inheritance nor by being referenced by a slot. A finding may indicate a forgotten or unused class, or a class lacking a slot that should connect it to the rest of the model.
  modellanalyse.ikkje_tilkopla_container.tittel:
    nn: Klasser ikkje kopla til containerklassen
    en: Classes not connected to the container class
  modellanalyse.ikkje_tilkopla_container.forklaring:
    nn: Analysen sjekkar om kvar klasse i skjemaet er nåbar frå containerklassen (`tree_root`) via slot-referansar. Ei klasse som ikkje er nåbar dukkar ikkje opp i instansar eller JSON-Schema generert frå containerklassen, og kan vere daud kode i skjemaet.
    en: The analysis checks whether every class in the schema is reachable from the container class (`tree_root`) through slot references. A class that is not reachable does not appear in instances or JSON Schema generated from the container class, and may be dead code in the schema.
  modellanalyse.ubrukte_slots.tittel:
    nn: Ubrukte slots
    en: Unused slots
  modellanalyse.ubrukte_slots.forklaring:
    nn: Analysen finn slots definerte lokalt i skjemaet som ingen klasse faktisk brukar. Slike slots aukar vedlikehaldsbyrda og kan forvirre lesarar om kva som er i aktiv bruk — vurder å fjerne dei eller kople dei til rette klassar.
    en: The analysis finds slots defined locally in the schema that no class actually uses. Such slots increase the maintenance burden and may confuse readers about what is in active use — consider removing them or connecting them to the right classes.
  modellanalyse.ubrukte_types.tittel:
    nn: Ubrukte types
    en: Unused types
  modellanalyse.ubrukte_types.forklaring:
    nn: Analysen finn types definerte lokalt i skjemaet som ingen slot brukar som `range`. Ein ubrukt type er ei daud definisjon som bør fjernast eller takast i bruk.
    en: The analysis finds types defined locally in the schema that no slot uses as `range`. An unused type is a dead definition that should be removed or put to use.
  modellanalyse.ubrukte_enums.tittel:
    nn: Ubrukte enumerations
    en: Unused enumerations
  modellanalyse.ubrukte_enums.forklaring:
    nn: Analysen finn enumerations definerte lokalt i skjemaet som ingen slot brukar som `range`. Ein ubrukt enumeration er ei daud definisjon som bør fjernast eller takast i bruk.
    en: The analysis finds enumerations defined locally in the schema that no slot uses as `range`. An unused enumeration is a dead definition that should be removed or put to use.
  modellanalyse.ubrukte_subsets.tittel:
    nn: Ubrukte subsets
    en: Unused subsets
  modellanalyse.ubrukte_subsets.forklaring:
    nn: Analysen finn subsets definerte lokalt i skjemaet som ingen klasse eller slot er merkt med. Eit ubrukt subset gjev ingen reell gruppering og bør fjernast eller takast i bruk.
    en: The analysis finds subsets defined locally in the schema that no class or slot is tagged with. An unused subset provides no real grouping and should be removed or put to use.
  modellanalyse.liknande_klassenavn.tittel:
    nn: Liknande klassenavn
    en: Similar class names
  modellanalyse.liknande_klassenavn.objekttype:
    nn: klassenavn
    en: class names
  modellanalyse.liknande_klassenavn.forklaring:
    nn: Analysen samanliknar klassenamn i dette skjemaet mot klassenamn i andre skjema i same domene, og flaggar par med høg navnelikskap. Eit funn kan tyde på utilsikta duplisering av same omgrep under ulike namn — vurder konsolidering eller import i staden for ny lokal definisjon.
    en: The analysis compares class names in this schema with class names in other schemas in the same domain, and flags pairs with high name similarity. A finding may indicate unintended duplication of the same concept under different names — consider consolidation or import instead of a new local definition.
  modellanalyse.liknande_klassenavn.kryssdomene:
    nn: Analyse av klassenavn på tvers av alle domene
    en: Analysis of class names across all domains
  modellanalyse.liknande_slotnavn.tittel:
    nn: Liknande slotnavn
    en: Similar slot names
  modellanalyse.liknande_slotnavn.objekttype:
    nn: slotnavn
    en: slot names
  modellanalyse.liknande_slotnavn.forklaring:
    nn: Analysen samanliknar slotnamn i dette skjemaet mot slotnamn i andre skjema i same domene, og flaggar par med høg navnelikskap. Eit funn kan tyde på utilsikta duplisering av same omgrep under ulike namn — vurder konsolidering eller import i staden for ny lokal definisjon.
    en: The analysis compares slot names in this schema with slot names in other schemas in the same domain, and flags pairs with high name similarity. A finding may indicate unintended duplication of the same concept under different names — consider consolidation or import instead of a new local definition.
  modellanalyse.liknande_slotnavn.kryssdomene:
    nn: Analyse av slotnavn på tvers av alle domene
    en: Analysis of slot names across all domains
  modellanalyse.liknande_typenavn.tittel:
    nn: Liknande typenavn
    en: Similar type names
  modellanalyse.liknande_typenavn.objekttype:
    nn: typenavn
    en: type names
  modellanalyse.liknande_typenavn.forklaring:
    nn: Analysen samanliknar typenamn i dette skjemaet mot typenamn i andre skjema i same domene, og flaggar par med høg navnelikskap. Eit funn kan tyde på utilsikta duplisering av same omgrep under ulike namn — vurder konsolidering eller import i staden for ny lokal definisjon.
    en: The analysis compares type names in this schema with type names in other schemas in the same domain, and flags pairs with high name similarity. A finding may indicate unintended duplication of the same concept under different names — consider consolidation or import instead of a new local definition.
  modellanalyse.liknande_typenavn.kryssdomene:
    nn: Analyse av typenavn på tvers av alle domene
    en: Analysis of type names across all domains

  # --- Modellanalyse på tvers av domene (publish.sh: modellanalyse/index.md) ---
  modellanalyse.alle.tittel:
    nn: Modellanalyse på tvers av domene
    en: Model analysis across domains
  modellanalyse.alle.innleiing:
    nn: |-
      Desse sidene viser navnelikskaps-analysar køyrde på tvers av **alle**
      domene i repoet — til skilnad frå dei domene-scopa analysane som ligg
      under kvar enkelt modell sin `## Modellanalyse`-seksjon.

      Alle modellanalyser blir kjørt automatisk i [Modell-analyse]({lenkje}) workflowen. Klikk deg inn på den siste køyringa av jobben for fulstendig analyseresultat.
    en: |-
      These pages show name similarity analyses run across **all**
      domains in the repository — as opposed to the domain-scoped analyses found
      in the `## Model analysis` section of each individual model.

      All model analyses run automatically in the [Modell-analyse]({lenkje}) workflow. Open the latest run of the job for the complete analysis results.
