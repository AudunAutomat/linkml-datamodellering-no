  seksjon.datamodell.kjelde:
    nn: "Kjelde-datamodell i LinkML-format: {lenkje}"
    en: "Source data model in LinkML format: {lenkje}"

  seksjon.er_diagram.tittel:
    nn: Entity-relationship diagram
    en: Entity-relationship diagram
  seksjon.er_diagram.forklaring:
    nn: ER-diagrammet viser struktur og relasjonar mellom dei lokale klassane i modellen. Importerte klasser er som standard filtrerte bort for å gjere diagrammet enklare å lese.
    en: The ER diagram shows the structure and relationships between the local classes of the model. Imported classes are filtered out by default to make the diagram easier to read.
  seksjon.er_diagram.alt:
    nn: ER-diagram
    en: ER diagram
  seksjon.er_diagram.ingen_lokale:
    nn: Modellen har ingen lokale klasser og ingen diagram med kun lokale klasser. [Vis fullstendig diagram med importerte klasser]({full}).
    en: The model has no local classes and no diagram with local classes only. [Show the full diagram with imported classes]({full}).
  seksjon.er_diagram.kun_lokale:
    nn: Diagrammet viser kun lokale klasser. Klikk for å zoome. [Vis fullstendig diagram med importerte klasser]({full}).
    en: The diagram shows local classes only. Click to zoom. [Show the full diagram with imported classes]({full}).
  seksjon.er_diagram.klikk_zoom:
    nn: Klikk for å zoome.
    en: Click to zoom.

  seksjon.avhengigheiter.tittel:
