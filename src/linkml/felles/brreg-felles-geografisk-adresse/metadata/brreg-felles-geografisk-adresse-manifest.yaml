tittel:
  nb: BRREG felles geografisk adresse
  nn: BRREG felles geografisk adresse
beskrivelse:
  nb: Gjenbrukbare geografiske adresseklassar utleia frå Brønnøysundregistrene (BR)
    sin interne BRReferansemodell_v3 (MagicDraw/XMI), pakken "Adresse" (GeografiskAdresse-hierarkiet),
    pluss dei adresse-relaterte komplekstypane frå Strukturtypekatalog_v1 (Poststed,
    Kommune, Fylke, Matrikkelnummer, Adressenummer) som adressehierarkiet er avhengig
    av. Sjå specs/done/felles-typar-enhetsregisteret-fra-br-katalogar.md for bakgrunn,
    metode og avklaringane denne modellen byggjer på.
  nn: Gjenbrukbare geografiske adresseklassar utleia frå Brønnøysundregistrene (BR)
    sin interne BRReferansemodell_v3 (MagicDraw/XMI), pakken "Adresse" (GeografiskAdresse-hierarkiet),
    pluss dei adresse-relaterte komplekstypane frå Strukturtypekatalog_v1 (Poststed,
    Kommune, Fylke, Matrikkelnummer, Adressenummer) som adressehierarkiet er avhengig
    av. Sjå specs/done/felles-typar-enhetsregisteret-fra-br-katalogar.md for bakgrunn,
    metode og avklaringane denne modellen byggjer på.
