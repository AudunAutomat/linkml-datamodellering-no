version: 1

description: >
  Generisk LinkML-baseline. Grunnleggjande metadata- og modelleringskrav som
  gjeld alle som modellerer i LinkML, utan norske eller repo-spesifikke
  føresetnader. Norsk offentleg / Digdir-spesifikke krav ligg i basis-no.
  Sjå specs/done/gjennomgang-bronze-policy-generisk.md.

# NB: required:/recommended: har FAST alvorsgrad (error/warning) og støttar
# IKKJE progresjon mellom policy-nivå (t.d. warning på bronse -> error på
# gull) — i motsetnad til checks:-mekanismen, som overstyrer per nøkkelnavn
# via _merge_policies(). Eit felt som skal kunne endre alvorsgrad på eit
# høgare nivå (som license/default_prefix) skal difor uttrykkjast som ein
# eigen checks:-oppføring (schema_field_present), IKKJE leggjast her.
# Legg heller ALDRI same felt i required OG recommended samstundes (verken
# i same fil eller på tvers av arva nivå) — det gjev både ein error og ein
# warning for éin og same manglande verdi. Sjå
# specs/done/full-gjennomgang-policy-alvorsgrad-og-overlapp.md (Funn B5) og
# specs/backlog/konsolider-feltnaervaer-sjekk-i-checks-mekanismen.md for
# grunngjeving og plan for å konsolidere dette til éin mekanisme.

# Felt som MÅ vere til stades (severity: error)
required:
  schema:
    - id
    - name
    - title
  class: []
  slot: []

# Felt som BØR vere til stades (severity: warning)
recommended:
  schema:
    - description
    - version
  class:
    - description
  slot:
    - description

# Fellesklasser som skjemaet må bruke eller importere (tom = inga krav)
common_classes:
  must_use: []

# LinkML sin innebygde linter — regelsettet `recommended`, med overstyringar.
# Arva og merga per regel av policyar som extends bronze (sjå
# _merge_policies i server.py), slik at t.d. gold kan heve level utan å
# gjenta resten av regelkonfigen.
linter:
  extends: recommended
  rules:
    # Same krav vert alt handheva av required:/recommended: over — linterens
    # variant ville gjeve eit dobbeltsignal for same manglande description.
    recommended:
      level: disabled
    # Vil ha t.d. "dcterms" i staden for "dct" — for strengt for ein generisk
    # baseline der prefiksval er opp til modelleraren.
    canonical_prefixes:
      level: disabled
    # Klasser/enum: UpperCamelCase, slots/attributt: snake_case. Importerte
    # element vert ekskluderte automatisk, og build.yaml `slot_naming: camel`
    # overstyrer slotmønsteret for skjema som arvar camelCase frå kjelda.
    # Permissible values er unntekne: dei speglar ofte eksterne kodelister
    # (t.d. CC0, NLOD_2_0) der kjeldeforma skal takast vare på.
    standard_naming:
      level: warning
      exclude_type:
        - permissible_value

# Generelle modelleringskvalitets-sjekkar
checks:

  schema_id_is_http_uri:
    severity: error
    description: >
      schema.id skal vere ein HTTP(S)-URI — persistent og globalt unik identifikator.
      Gjer skjemaet adresserbart og søkbart i katalogtenester.
    check: schema_id_is_http_uri
    digdir_rule: 4
    fair_principle: F1

  schema_has_default_prefix:
    severity: error
    description: >
      schema.default_prefix skal vere til stades. Utan default_prefix kan ikkje
      modellelement adresserast med persistente URI-ar (Digdir-regel 4: Identifiserbarhet).
    check: schema_field_present
    field: default_prefix
    digdir_rule: 4

  default_prefix_is_absolute_uri:
    severity: error
    description: >
      schema.default_prefix skal ekspandere til ein absolutt HTTP(S)-URI som
      endar på '/' eller '#' — anten som eit prefiksnavn deklarert i prefixes:
      (idiomatisk LinkML) eller som ein literal URI. Sikrar at genererte
      element-URI-ar er gyldige (Digdir-regel 4: Identifiserbarhet).
    check: default_prefix_is_absolute_uri
    digdir_rule: 4

  schema_has_license:
    severity: warning
    description: >
      schema.license bør vere til stades med URI til ein open lisens
      (t.d. CC BY 4.0). Støttar Digdir-regel 7 (Tilgjengeliggjøring) om at
      modellen skal vere fritt tilgjengeleg.
    check: schema_field_present
    field: license
    digdir_rule: 7
    fair_principle: R1.1

  no_inlined_on_primitive_range:
    severity: warning
    description: >
      inlined/inlined_as_list bør berre setjast på slot/attributt der range er
      ein klasse. På ein primitiv range (string, integer, LangString o.l.) har
      nøkkelen ingen effekt — han vert stille ignorert av alle generatorane, og
      framstår som daud, misvisande konfigurasjon.
    check: no_inlined_on_primitive_range
    digdir_rule: 8
    fair_principle: I1

  local_types_have_standard_uri:
    severity: warning
    description: >
      Lokalt definerte typar (schemaets eige types:-felt) bør ha ein uri: mot
      eit standardisert namnerom (xsd/rdf/rdfs/owl), eigen eller arva via
      typeof. Digdir-regel 15: Standardiserte datatyper. Typar arva frå
      linkml:types er alt garantert XSD-mappa av LinkML-modellen sjølv og
      treng ingen eigen sjekk.
    check: local_types_have_standard_uri
    digdir_rule: 15
    fair_principle: I1
