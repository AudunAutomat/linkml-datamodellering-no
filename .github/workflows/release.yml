name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

# REGISTRY vert rekna ut i bash per steg: GitHub-uttrykk har ingen lower(),
# og github.repository_owner kan ha store bokstavar (t.d. AudunAutomat) —
# sjå specs/backlog/ci-etter-origin-flytting-audunautomat.md (F1).
jobs:
  linkml-local:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set opp podman (crun + GHCR-login)
        uses: ./.github/actions/prepare-podman
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Hent eller bygg linkml-local
        run: |
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"  # OCI krev små bokstavar (F1)
          HASH_TAG="${REGISTRY}/linkml-local:${{ hashFiles('src/assets/containers/Dockerfile.linkml') }}"
          if ! podman pull "$HASH_TAG" 2>/dev/null; then
            podman build -f src/assets/containers/Dockerfile.linkml -t localhost/linkml-local:latest .
            podman tag localhost/linkml-local:latest "$HASH_TAG"
            podman push "$HASH_TAG"
          fi
          podman tag "$HASH_TAG" "${REGISTRY}/linkml-local:${{ github.ref_name }}"
          podman tag "$HASH_TAG" "${REGISTRY}/linkml-local:latest"
          podman push "${REGISTRY}/linkml-local:${{ github.ref_name }}"
          podman push "${REGISTRY}/linkml-local:latest"

  mcp-linkml-validator:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set opp podman (crun + GHCR-login)
        uses: ./.github/actions/prepare-podman
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Hent eller bygg mcp-linkml-validator
        run: |
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"  # OCI krev små bokstavar (F1)
          HASH_TAG="${REGISTRY}/mcp-linkml-validator:${{ hashFiles('src/assets/containers/Dockerfile.mcp-linkml') }}"
          if ! podman pull "$HASH_TAG" 2>/dev/null; then
            podman build --format docker -f src/assets/containers/Dockerfile.mcp-linkml --target validator -t localhost/mcp-linkml-validator:latest .
            podman tag localhost/mcp-linkml-validator:latest "$HASH_TAG"
            podman push "$HASH_TAG"
          fi
          podman tag "$HASH_TAG" "${REGISTRY}/mcp-linkml-validator:${{ github.ref_name }}"
          podman tag "$HASH_TAG" "${REGISTRY}/mcp-linkml-validator:latest"
          podman push "${REGISTRY}/mcp-linkml-validator:${{ github.ref_name }}"
          podman push "${REGISTRY}/mcp-linkml-validator:latest"

  mcp-linkml-modell-utkast:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set opp podman (crun + GHCR-login)
        uses: ./.github/actions/prepare-podman
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bygg og push mcp-linkml-modell-utkast
        run: |
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"  # OCI krev små bokstavar (F1)
          podman build \
            --format docker \
            -f src/assets/containers/Dockerfile.mcp-linkml \
            --target modell-utkast \
            -t "${REGISTRY}/mcp-linkml-modell-utkast:${{ github.ref_name }}" \
            .
          podman tag \
            "${REGISTRY}/mcp-linkml-modell-utkast:${{ github.ref_name }}" \
            "${REGISTRY}/mcp-linkml-modell-utkast:latest"
          podman push "${REGISTRY}/mcp-linkml-modell-utkast:${{ github.ref_name }}"
          podman push "${REGISTRY}/mcp-linkml-modell-utkast:latest"

  mcp-linkml-begrep-utkast:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set opp podman (crun + GHCR-login)
        uses: ./.github/actions/prepare-podman
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bygg og push mcp-linkml-begrep-utkast
        run: |
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"  # OCI krev små bokstavar (F1)
          podman build \
            --format docker \
            -f src/assets/containers/Dockerfile.mcp-linkml \
            --target begrep-utkast \
            -t "${REGISTRY}/mcp-linkml-begrep-utkast:${{ github.ref_name }}" \
            .
          podman tag \
            "${REGISTRY}/mcp-linkml-begrep-utkast:${{ github.ref_name }}" \
            "${REGISTRY}/mcp-linkml-begrep-utkast:latest"
          podman push "${REGISTRY}/mcp-linkml-begrep-utkast:${{ github.ref_name }}"
          podman push "${REGISTRY}/mcp-linkml-begrep-utkast:latest"
