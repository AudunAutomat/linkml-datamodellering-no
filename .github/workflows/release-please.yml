name: Release Please

# Automatisk release-PR-oppretting og GitHub Releases:
# 1. Push til main med semantisk commit (feat/fix) som endrar *-schema.yaml
#    → release-please opprettar/oppdaterer release-PR automatisk
# 2. Denne workflowen oppdaterer version, endringsdato og utgivelsesdato i *-schema.yaml
# 3. auto-approve-release-please.yml godkjenner PR-en automatisk
# 4. PR vert merga automatisk når alle checks passerer (auto-merge)
#    → GitHub Releases vert oppretta automatisk med artefakter (JSON Schema, SHACL, OWL, osv.)
#
# Manuell trigger via workflow_dispatch er tilgjengeleg for admin.

on:
  workflow_dispatch:
  push:
    branches: [main]

# Kø, ikkje kanseller: denne workflowen gjer mutasjonar (manifest-commit,
# git-tags, releases) som ikkje er trygge å avbryte midtvegs. Utan
# cancel-in-progress ventar eit samstundes-triggera løp (t.d. manuell
# workflow_dispatch midt i eit automatisk push-triggera løp) til det
# føregåande er ferdig, i staden for å skrive til same manifest samstundes.
concurrency:
  group: release-please

jobs:
  release-please:
    runs-on: ubuntu-22.04
    # Alle skrivande handlingar (PR, push, merge, releases, taggar) går no via
    # installasjonstokenet til GitHub-appen linkml-release-bot, ikkje
    # GITHUB_TOKEN. GITHUB_TOKEN treng difor berre lesetilgang (checkout).
    # Sjå specs/backlog/github-app-for-release-please.md.
    permissions:
      contents: read
    steps:
      - name: Checkout for scope-sjekk
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          # HEAD~1 må vere tilgjengeleg for filbasert diff-sjekk under.
          fetch-depth: 2

      - name: Sjekk om siste commit skal trigge release-please
        id: check_commit_type
        if: github.event_name == 'push'
        env:
          # Sendt via env i staden for direkte interpolert i scriptet —
          # github.event.head_commit.message er ikkje tiltrudd innhald
          # (skrive av kven som helst med push-tilgang), og direkte
          # tekst-substitusjon inn i eit run:-script opnar for
          # script-injection (jf. actionlint sitt [expression]-funn).
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Hent berre første linje av commit-meldinga
          FIRST_LINE=$(echo "$COMMIT_MESSAGE" | head -n 1)

          # 0. Aldri hopp over release-please sin eigen PR-merge-commit.
          # Denne pushen er den einaste sjansen release-please-action får til
          # å detektere at ei release-PR nettopp vart merga og fullføre
          # tag-/release-oppretting — commit-meldinga ("Merge pull request
          # #N from .../release-please--branches--main") matchar aldri
          # feat/fix-mønstera under, og ei seinare, tilfeldig triggera
          # køyring plukkar IKKJE opp den ferske merge-tilstanden retroaktivt.
          # Sjå specs/done/release-please-merge-commit-skip-bug.md.
          if echo "$FIRST_LINE" | grep -qE '^Merge pull request #[0-9]+ from .*/release-please--branches--main'; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Siste commit er release-please sin eigen PR-merge — held fram"
            exit 0
          fi

          # 1. Hopp over ikkje-releasande typar (uavhengig av scope)
          if echo "$FIRST_LINE" | grep -qE '^(style|docs|chore|test|ci|build|perf|refactor)(\(.*\))?:'; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Siste commit er ikkje ein release-utløysande type — hoppar over"
            exit 0
          fi

          # 2. feat/fix (uansett scope, fleire kommaseparerte scope, eller
          #    ingen scope) — trigg berre dersom commiten faktisk endrar
          #    minst éin *-schema.yaml. Scope-teksten vert IKKJE brukt til å
          #    avgjere dette: release-please-action sjølv avgjer kva pakkar
          #    som får versjonsbump basert på filstiar, ikkje commit-scope,
          #    og kommaseparerte multi-scope-commits (t.d.
          #    "fix(ap-no,fint,fair,begrepskatalog): ...") er eit etablert,
          #    legitimt mønster i repoet som eit scope-kvitelist-regex
          #    strukturelt aldri kan matche. Sjå
          #    specs/backlog/release-please-skip-filter-for-strengt.md.
          if echo "$FIRST_LINE" | grep -qE '^(feat|fix)(\(.*\))?:'; then
            CHANGED_SCHEMAS=$(git diff --name-only HEAD~1 HEAD -- 'src/linkml/*/*/*-schema.yaml')
            if [ -n "$CHANGED_SCHEMAS" ]; then
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "Siste commit er feat/fix og endrar skjema:"
              echo "$CHANGED_SCHEMAS"
            else
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "Siste commit er feat/fix, men endrar ingen *-schema.yaml — hoppar over"
            fi
            exit 0
          fi

          # 3. Elles: ikkje feat/fix — hopp over
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "Siste commit er ikkje feat/fix — hoppar over"

      - name: Hent token for linkml-release-bot
        id: app-token
        if: |
          (github.event_name == 'push' && steps.check_commit_type.outputs.skip != 'true') ||
          github.event_name == 'workflow_dispatch'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Hent git-identitet for linkml-release-bot
        id: bot-user
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      # token: → git push av dato-commiten (T2b) går som appen, slik at
      # pull_request_target (auto-approve) vert utløyst og gir ny godkjenning
      # etter siste push (dismiss_stale_reviews_on_push i ruleset-en).
      - name: Checkout for release-please
        if: |
          (github.event_name == 'push' && steps.check_commit_type.outputs.skip != 'true') ||
          github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        if: |
          (github.event_name == 'push' && steps.check_commit_type.outputs.skip != 'true') ||
          github.event_name == 'workflow_dispatch'
        id: release-please
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      - name: Oppdater schema-versjonar i release-PR
        if: ${{ steps.release-please.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_NAME: ${{ steps.bot-user.outputs.name }}
          BOT_EMAIL: ${{ steps.bot-user.outputs.email }}
        run: |
          # `separate-pull-requests: true` gjer at release-please lagar éin PR
          # per komponent — outputs.prs (fleirtal) er JSON-arrayen med ALLE
          # av dei. Det eintalige outputs.pr fangar berre éin tilfeldig PR og
          # må ikkje brukast her (jf. specs/done/fiks-release-please-multi-pr-bug.md).
          PRS_JSON='${{ steps.release-please.outputs.prs }}'

          echo "$PRS_JSON" | jq -c '.[]' | while read -r pr_json; do
            PR_NUMBER=$(echo "$pr_json" | jq -r '.number')
            BRANCH=$(echo "$pr_json" | jq -r '.headBranchName')

            echo "Sjekkar ut PR-branch: $BRANCH (PR #$PR_NUMBER)"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"

            # Synkroniser version/endringsdato/utgivelsesdato for alle pakkar
            # frå .github/release-please-manifest.json. Skjemastien vert
            # utleia direkte frå pakke-stien (<pkg_path>/<basename>-schema.yaml)
            # — sjå src/assets/scripts/update-schema-dates.py.
            python3 src/assets/scripts/update-schema-dates.py

            # Commit og push endringane til PR-branchen
            git config user.name "$BOT_NAME"
            git config user.email "$BOT_EMAIL"
            git add -A

            if ! git diff --staged --quiet; then
              git commit -m "chore: oppdater schema-versjonar og datofelt [skip ci]"
              git push origin "$BRANCH"
              echo "Schema-filer oppdaterte og pusha til PR-branchen ($BRANCH)"
            else
              echo "Ingen endringar i schema-filer for $BRANCH — hoppar over commit"
            fi
          done

      - name: Informer om release-PR og aktiver auto-merge
        if: ${{ steps.release-please.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Same grunngjeving som steget over: løkk over outputs.prs (fleirtal),
          # ikkje det eintalige outputs.pr.
          PRS_JSON='${{ steps.release-please.outputs.prs }}'

          echo "$PRS_JSON" | jq -c '.[]' | while read -r pr_json; do
            PR_NUMBER=$(echo "$pr_json" | jq -r '.number')
            echo "::notice::Release-PR oppretta: https://github.com/${{ github.repository }}/pull/$PR_NUMBER"

            # Aktiver auto-merge (vert merga når alle checks passerer og PR er godkjent).
            # Eitt automatisk gjenforsøk med kort pause — GitHub kan bruke nokre
            # sekund på å ferdigrekne mergeability rett etter PR-oppretting, som
            # elles gir ein forbigåande "Pull Request is not mergeable"-feil.
            # --merge (ikkje --squash): commit-filteret øvst i denne workflowen
            # slepp berre gjennom "Merge pull request #N from
            # .../release-please--branches--main" etter merge — ein squash-commit
            # ("chore: release main (#N)") ville vorte hoppa over som chore, og
            # ingen release ville vorte laga.
            if ! gh pr merge "$PR_NUMBER" --auto --merge 2>/tmp/merge-err-"$PR_NUMBER".log; then
              sleep 5
              if ! gh pr merge "$PR_NUMBER" --auto --merge 2>>/tmp/merge-err-"$PR_NUMBER".log; then
                echo "::warning::Kunne ikkje aktivere auto-merge for PR #$PR_NUMBER: $(cat /tmp/merge-err-"$PR_NUMBER".log)"
                continue
              fi
            fi
            echo "Auto-merge aktivert for PR #$PR_NUMBER"
          done

      # persist-credentials: false — byggestega under (make build-docker-*,
      # make gen-*) skal ikkje ha tilgang til noko skrivetoken. Taggane vert
      # laga via API i eige steg (O4 i specs/backlog/github-app-for-release-please.md).
      - name: Checkout for artefakt-generering
        if: ${{ steps.release-please.outputs.releases_created == 'true' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generer artefakter for releases
        if: ${{ steps.release-please.outputs.releases_created == 'true' }}
        run: |
          # Installer podman (for containerbygging)
          sudo apt-get update && sudo apt-get install -y podman

          # Bygg nødvendige images
          make build-docker-linkml
          make build-docker-python
          make build-docker-avrotize

          # Generer artefakter for kvar releaset pakke
          echo '${{ steps.release-please.outputs.paths_released }}' | jq -r '.[]' | while read pkg_path; do
            echo "Genererer artefakter for $pkg_path"
            schema=$(python3 src/assets/scripts/update-schema-dates.py --print-schema-path "$pkg_path") || { echo "::warning::Fann ikkje skjema for $pkg_path"; continue; }
            make gen-jsonschema SCHEMA="$schema"
            make gen-shacl SCHEMA="$schema"
            make gen-owl SCHEMA="$schema"
            make gen-jsonld-context SCHEMA="$schema"
            make gen-erdiagram-mermaid SCHEMA="$schema"
          done

      - name: Last opp artefakter til GitHub Releases
        if: ${{ steps.release-please.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Iterer gjennom alle releases som vart oppretta
          echo '${{ toJSON(steps.release-please.outputs) }}' | jq -r '.paths_released[]' | while read pkg_path; do
            # Hent tag-navn frå release-please outputs
            tag_name=$(echo '${{ toJSON(steps.release-please.outputs) }}' | jq -r --arg path "$pkg_path" '.releases[$path].tag_name')

            # Finn genererte artefakter
            domain=$(echo "$pkg_path" | cut -d/ -f3)
            model=$(echo "$pkg_path" | cut -d/ -f4)

            echo "Lastar opp artefakter for $model (tag: $tag_name)"

            # Last opp artefakter (ignorer feil dersom filer ikkje finst)
            gh release upload "$tag_name" \
              "generated/$domain/$model/$model-schema.json" \
              "generated/$domain/$model/$model-shapes.ttl" \
              "generated/$domain/$model/$model-ontology.ttl" \
              "generated/$domain/$model/$model-context.jsonld" \
              "generated/$domain/$model/$model-erdiagram.md" \
              "$pkg_path/$model-schema.yaml" \
              --clobber || echo "::warning::Nokre artefakter vart ikkje lasta opp for $model"
          done

      - name: Opprett per-schema git-tags
        if: ${{ steps.release-please.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Opprettar per-schema tags for release..."

          # Taggane vert laga via API (annotert tag-objekt + ref) i staden for
          # git tag/push, sidan checkout-en over ikkje har lagra credentials.
          sha=$(git rev-parse HEAD)

          # Iterer berre over schema i paths_released (ikkje alle schema)
          echo '${{ toJSON(steps.release-please.outputs) }}' | jq -r '.paths_released[]' | while read pkg_path; do
            schema_file=$(python3 src/assets/scripts/update-schema-dates.py --print-schema-path "$pkg_path") || { echo "⚠️  Ingen schema-fil funne i $pkg_path"; continue; }

            # Les versjon frå schema-fil
            version=$(grep -m1 '^version:' "$schema_file" | sed -E 's/^version:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/')

            if [ -z "$version" ] || [ "$version" = "null" ]; then
              echo "⚠️  $schema_file: mangler version-felt"
              continue
            fi

            schema=$(basename "$schema_file" .yaml | sed 's/-schema$//')
            domain=$(basename "$(dirname "$(dirname "$schema_file")")")
            tag_name="${schema}-v${version}"

            # Sjekk om tag allereie finst — mot origin via API, ikkje lokalt:
            # checkout-en er grunn (fetch-depth 1) og hentar ikkje taggar, så
            # `git tag -l` fann aldri taggar som alt låg i origin. 404 er venta
            # når taggen manglar.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag_name" >/dev/null 2>&1; then
              echo "✅ Tag $tag_name finst allereie"
              continue
            fi

            echo "🏷️  Opprettar tag $tag_name for $domain/$schema"
            if ! tag_obj=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/tags" \
                  -f tag="$tag_name" -f message="Release $schema version $version" \
                  -f object="$sha" -f type=commit --jq .sha); then
              echo "::error::Kunne ikkje lage tag-objekt for $tag_name"
              exit 1
            fi
            if ! gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                  -f ref="refs/tags/$tag_name" -f sha="$tag_obj" >/dev/null; then
              echo "::error::Kunne ikkje lage ref refs/tags/$tag_name"
              exit 1
            fi
            echo "::notice::Oppretta git-tag: $tag_name"
          done
