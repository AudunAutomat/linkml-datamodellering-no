name: Auto-approve release-please PRs

# Godkjenner automatisk release-please sine PRs, slik at dei kan mergast
# automatisk når alle checks passerer (via auto-merge).

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  auto-approve:
    runs-on: ubuntu-22.04
    # Release-PR-ar vert oppretta av GitHub-appen linkml-release-bot, så
    # PR-forfattaren er linkml-release-bot[bot]. Godkjenninga skjer med
    # GITHUB_TOKEN (github-actions[bot]) — ein annan aktør enn den som pushar
    # siste commit, slik ruleset-en krev (require_last_push_approval).
    # head.repo-sjekken hindrar at ein fork-PR med same branch-prefiks vert
    # godkjend (repoet er offentleg). Sjå
    # specs/backlog/github-app-for-release-please.md.
    if: |
      (github.event.pull_request.user.login == 'github-actions[bot]' ||
       github.event.pull_request.user.login == 'linkml-release-bot[bot]') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--branches--')
    permissions:
      pull-requests: write
    steps:
      - name: Godkjenn release-PR
        run: gh pr review ${{ github.event.pull_request.number }} --approve --body "Auto-approved by CI"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
