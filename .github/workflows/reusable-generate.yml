name: Reusable - LinkML generering

on:
  workflow_call:
    inputs:
      schema:
        description: 'Sti til skjemafil (relativ til repo-rota, t.d. src/linkml/mitt-domene/min-modell/min-modell-schema.yaml)'
        type: string
        required: true
      version:
        description: 'Versjon av linkml-datamodellering-no (t.d. v1.0.0). Overstyrer linkml-datamodellering.yaml. Standard: latest (= nyaste vX.Y.Z).'
        type: string
        default: ''
    outputs:
      artifact-name:
        description: 'Navnet på GitHub Actions-artefakten med genererte filer'
        value: ${{ jobs.generate.outputs.artifact-name }}

jobs:
  generate:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      # actions/upload-artifact@v7 har ikkje eit "artifact-name"-output
      # (berre artifact-id/artifact-url/artifact-digest) — dette var difor
      # alltid tomt for alle kallarar. Navnet er kjent på førehand (sett
      # eksplisitt i steget under), så vi eksponerer det direkte i staden
      # for å late som det kjem frå steget sitt output.
      artifact-name: linkml-generated-${{ github.run_id }}

    steps:
      - name: Sjekk ut kallande repo
        uses: actions/checkout@v7

      # Løyser version-input / ap-no-version / latest til ein konkret vX.Y.Z
      # som vert brukt både som git-ref og image-tag (BUG-22). Referert med
      # full sti fordi `./` peikar på kallande repo når workflowen er kalla
      # eksternt — sjå specs/done/reusable-workflow-versjon.md. Låst til SHA
      # (ikkje @main), så ein release-tag av workflowen alltid brukar same
      # actionversjon; royktest-reusable.yml feilar dersom SHA-en har drifta
      # frå actionen på HEAD — sjå specs/done/codeql-reusable-workflows-7-varsel.md.
      - name: Løys versjon (input / linkml-datamodellering.yaml / latest)
        id: config
        uses: AudunAutomat/linkml-datamodellering-no/.github/actions/resolve-linkml-version@9e2cdc8e7039c71909d5ca04033473052c9a5150 # main
        with:
          version: ${{ inputs.version }}

      # Hentar Makefile/make/ frå denne workflowen sitt eige repo i staden
      # for å reimplementere "korleis generere artefakt X" på nytt her —
      # same generator-kommandoar (gen-shacl, gen-owl, osv.) som intern CI
      # og lokal utvikling brukar, éin kjelde i staden for to som kan drive
      # frå kvarandre. gen-config.sh er med sidan Makefile sin config.mk-
      # regel (shacl_flags/owl_flags/rdf-skip-overstyringar frå build.yaml)
      # elles ville feila når han manglar.
      - name: Hent make-verktøy frå AudunAutomat/linkml-datamodellering-no
        uses: actions/checkout@v7
        with:
          repository: AudunAutomat/linkml-datamodellering-no
          ref: ${{ steps.config.outputs.version }}
          persist-credentials: false
          sparse-checkout: |
            Makefile
            make
            src/assets/scripts/makefile/gen-config.sh
          path: _linkml-tools

      - name: Kopier make-verktøy til repo-rota
        run: |
          # Makefile sin include-struktur (make/00-*.mk til make/90-*.mk) må
          # liggje relativt til CWD, og LINKML_RUN mountar $(CURDIR) — begge
          # krev at Makefile/make/ ligg i repo-rota, ikkje i ein underkatalog.
          # Trygt sidan kallande repo forventast å følgje src/linkml/-
          # konvensjonen (jf. inputs.schema sin dokumenterte sti) og difor
          # normalt ikkje har eigen Makefile/make/ i rota frå før.
          if [ -f Makefile ] || [ -d make ]; then
            echo "::error::Kallande repo har alt ein Makefile/make/-katalog i rota — reusable-generate.yml kan ikkje trygt kopiere over utan å risikere å overskrive han. Kontakt vedlikehaldar av AudunAutomat/linkml-datamodellering-no."
            exit 1
          fi
          cp _linkml-tools/Makefile .
          cp -r _linkml-tools/make .
          mkdir -p src/assets/scripts/makefile
          cp _linkml-tools/src/assets/scripts/makefile/gen-config.sh src/assets/scripts/makefile/gen-config.sh
          rm -rf _linkml-tools

      - name: Trekk inn linkml-local image
        env:
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          podman pull "ghcr.io/audunautomat/linkml-local:${VERSION}"
          podman tag  "ghcr.io/audunautomat/linkml-local:${VERSION}" localhost/linkml-local:latest

      - name: Køyr generatorar via make (respekterer build.yaml-flagg)
        env:
          SCHEMA: ${{ inputs.schema }}
        run: |
          set -euo pipefail

          SCHEMA_LOCAL_DIR=$(dirname "$SCHEMA")
          NAME=$(basename "$SCHEMA_LOCAL_DIR")
          DOMAIN=$(basename "$(dirname "$SCHEMA_LOCAL_DIR")")
          OUT="generated/${DOMAIN}/${NAME}"

          MANIFEST="${SCHEMA_LOCAL_DIR}/build.yaml"

          # Les generator-flagg frå build.yaml (standard: true) — avgjer
          # BERRE om ein generator skal køyrast i det heile, ikkje kva
          # flagg han skal bruke (shacl_flags/owl_flags/rdf-skip vert
          # automatisk henta frå config.mk, generert av gen-config.sh,
          # via Makefile sin eigen -include config.mk-mekanisme).
          read_flag() {
            local key="$1" default="${2:-true}"
            if [ -f "$MANIFEST" ]; then
              val=$(grep -E "^  ${key}:" "$MANIFEST" | awk '{print $2}' || true)
              echo "${val:-$default}"
            else
              echo "$default"
            fi
          }

          run_gen() {
            local flag="$1" target="$2"
            if [ "$(read_flag "$flag")" = "false" ]; then
              echo "Hoppar over ${target} (${flag}: false)"
              return
            fi
            make "$target" SCHEMA="$SCHEMA"
          }

          run_gen jsonld_context gen-jsonld-context
          run_gen json_schema    gen-jsonschema
          run_gen python         gen-python
          run_gen protobuf       gen-proto
          run_gen shacl          gen-shacl
          run_gen owl            gen-owl
          run_gen rdf            gen-rdf

          # Eksempel-RDF — finst ikkje som eit frittståande make-target
          # (berre inline i make/20-domain-targets.mk sin domain_target-
          # pipeline), difor framleis direkte linkml-convert her.
          if [ "$(read_flag example_rdf)" != "false" ]; then
            EXAMPLE="${SCHEMA_LOCAL_DIR}/examples/${NAME}-eksempel.yaml"
            if [ -f "$EXAMPLE" ]; then
              echo "→ linkml-convert  ${EXAMPLE}"
              mkdir -p "$OUT"
              podman run --rm -v "$PWD:/work" -w /work -e PYTHONWARNINGS=ignore localhost/linkml-local:latest \
                linkml-convert --schema "$SCHEMA" --output-format ttl --no-validate \
                --output "$OUT/${NAME}-eksempel.ttl" "$EXAMPLE"
            fi
          fi

          echo "Genererte artefakter:"
          ls -lh "$OUT/"

      - name: Last opp genererte artefakter
        uses: actions/upload-artifact@v7
        with:
          name: linkml-generated-${{ github.run_id }}
          path: generated/
          retention-days: 7
