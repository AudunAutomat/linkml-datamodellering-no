name: Reusable - LinkML validering

on:
  workflow_call:
    inputs:
      schema:
        description: 'Sti til skjemafil (relativ til repo-rota, t.d. src/linkml/mitt-domene/min-modell/min-modell-schema.yaml)'
        type: string
        required: true
      policy:
        description: 'Valideringspolicy: bronze / basis-no / silver / gold / felles-datakatalog / felles-begrepskatalog'
        type: string
        default: 'bronze'
      instance:
        description: 'Sti til instansfil (valfri). Vert funne automatisk frå examples/ om han ikkje er oppgitt.'
        type: string
        default: ''
      version:
        description: 'Versjon av linkml-datamodellering-no (t.d. v1.0.0). Overstyrer linkml-datamodellering.yaml. Standard: latest (= nyaste vX.Y.Z).'
        type: string
        default: ''

jobs:
  validate:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Sjekk ut kallande repo
        uses: actions/checkout@v7

      # Løyser version-input / ap-no-version / latest til ein konkret vX.Y.Z
      # som vert brukt både som git-ref og image-tag (BUG-22). Referert med
      # full sti fordi `./` peikar på kallande repo når workflowen er kalla
      # eksternt — sjå specs/done/reusable-workflow-versjon.md. Låst til SHA
      # (ikkje @main), så ein release-tag av workflowen alltid brukar same
      # actionversjon; royktest-reusable.yml feilar dersom SHA-en har drifta
      # frå actionen på HEAD — sjå specs/done/codeql-reusable-workflows-7-varsel.md.
      - name: Løys versjon (input / linkml-datamodellering.yaml / latest)
        id: config
        uses: AudunAutomat/linkml-datamodellering-no/.github/actions/resolve-linkml-version@6706c6cd8ac2d670e0fb7eaf424169071a855eea # main
        with:
          version: ${{ inputs.version }}

      - name: Hent validator-komponenter frå AudunAutomat/linkml-datamodellering-no
        uses: actions/checkout@v7
        with:
          repository: AudunAutomat/linkml-datamodellering-no
          ref: ${{ steps.config.outputs.version }}
          persist-credentials: false
          sparse-checkout: |
            src/mcp-linkml-validator/server.py
            src/mcp-linkml-validator/policies
            src/mcp-linkml-validator/flatten-and-validate.bash
            src/mcp-linkml-validator/annotate-validate.py
          path: _linkml-tools

      - name: Trekk inn container-image
        env:
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          podman pull "ghcr.io/audunautomat/mcp-linkml-validator:${VERSION}"
          podman tag  "ghcr.io/audunautomat/mcp-linkml-validator:${VERSION}" mcp-linkml-validator

      - name: Valider skjema
        env:
          SCHEMA: ${{ inputs.schema }}
          POLICY: ${{ inputs.policy }}
          INSTANCE: ${{ inputs.instance }}
        run: |
          result=$(
            REPO_ROOT="$GITHUB_WORKSPACE" \
            VALIDATOR_DIR="$GITHUB_WORKSPACE/_linkml-tools/src/mcp-linkml-validator" \
            bash _linkml-tools/src/mcp-linkml-validator/flatten-and-validate.bash \
              "$SCHEMA" "$POLICY" "$INSTANCE"
          )
          echo "$result"
          echo "$result" | python3 _linkml-tools/src/mcp-linkml-validator/annotate-validate.py "$SCHEMA"
