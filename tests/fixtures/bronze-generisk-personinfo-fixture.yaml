# Idiomatisk LinkML-skjema (mønster frå LinkML sin personinfo-tutorial) som
# regresjonsvern for at bronze-policyen held seg generisk: skal passere bronze
# utan error. Sjå specs/done/gjennomgang-bronze-policy-generisk.md.
id: https://w3id.org/linkml/examples/personinfo
name: personinfo
title: Person info
description: Information about people, based on schema.org
version: 0.1.0
license: https://creativecommons.org/publicdomain/zero/1.0/
prefixes:
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  personinfo: https://w3id.org/linkml/examples/personinfo/
default_prefix: personinfo
default_range: string
imports:
  - linkml:types
classes:
  NamedThing:
    description: A generic grouping for any identifiable entity
    class_uri: schema:Thing
    slots: [id, full_name]
  Person:
    is_a: NamedThing
    description: A person (alive, dead, undead, or fictional).
    class_uri: schema:Person
    slots: [primary_email, age]
    attributes:
      has_friend:
        range: Person
        multivalued: true
  Container:
    tree_root: true
    attributes:
      persons:
        multivalued: true
        inlined_as_list: true
        range: Person
slots:
  id:
    identifier: true
    slot_uri: schema:identifier
    description: identifier
  full_name:
    slot_uri: schema:name
    description: name
  primary_email:
    slot_uri: schema:email
    description: email
  age:
    range: integer
    description: age in years
